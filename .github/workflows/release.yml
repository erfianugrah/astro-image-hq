name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # NOTE: no registry-url here. setup-node would write an .npmrc with a
      # (now empty) _authToken, and npm CLI prefers token auth over the OIDC
      # exchange, which then 404s. OIDC trusted publishing needs NO npmrc auth.
      - name: Setup Node (for npm publish + provenance)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install libavif-bin
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libavif-bin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Typecheck + test + build
        run: |
          bun run typecheck
          bun run test
          bun run build

      # OIDC trusted publishing needs npm >= 11.15.0; node 22 bundles 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: auth is OIDC trusted publishing (id-token: write
      # above + the trust relationship configured on the package via
      # `npm trust github --allow-publish`). Token-based publishes are no
      # longer supported by npm for 2FA accounts.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --loglevel verbose
